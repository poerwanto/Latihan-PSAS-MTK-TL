function renderPacket(packet, containerId) {
  const container = document.getElementById(containerId);
  let html = '';

  // BAGIAN I: PILIHAN GANDA
  html += `
    <div class="part-banner">
      <h3>BAGIAN I. PILIHAN GANDA (Nomor 1 – 24)</h3>
      <p>Pilihlah satu jawaban yang paling tepat (A, B, C, D, atau E)!</p>
    </div>
  `;
  packet.pg.forEach(item => {
    const isLong = item.opts.some(o => o.length > 42 || o.includes('pmatrix'));
    const optsHtml = item.opts.map((opt, idx) => `
      <li class="option-item">
        <span class="opt-letter">${letters[idx]}.</span>
        <span>${opt}</span>
      </li>
    `).join('');

    html += `
      <div class="question-card">
        <div class="q-title">
          <span class="q-num">${item.no}</span>
          <div class="q-text">
            <div class="topic-tag">${item.topik}</div>
            <div>${item.q}</div>
          </div>
        </div>
        <ul class="options-list ${isLong ? 'vertical' : ''}">${optsHtml}</ul>
      </div>
    `;
  });

  // BAGIAN II: BENAR / SALAH
  html += `
    <div class="part-banner">
      <h3>BAGIAN II. BENAR ATAU SALAH (Nomor 25 – 34)</h3>
      <p>Tentukan apakah pernyataan berikut bernilai <strong>Benar</strong> atau <strong>Salah</strong>!</p>
    </div>
  `;
  packet.tf.forEach(item => {
    html += `
      <div class="question-card">
        <div class="q-title">
          <span class="q-num">${item.no}</span>
          <div class="q-text">
            <div class="topic-tag">${item.topik}</div>
            <div>${item.q}</div>
          </div>
        </div>
        <div class="tf-options">
          <span class="tf-box">&#9711; Benar</span>
          <span class="tf-box">&#9711; Salah</span>
        </div>
      </div>
    `;
  });

  // BAGIAN III: PILIHAN GANDA KOMPLEKS (CHECKBOX)
  html += `
    <div class="part-banner">
      <h3>BAGIAN III. PILIHAN GANDA KOMPLEKS / CHECKBOX (Nomor 35 – 37)</h3>
      <p>Pilihlah semua pernyataan yang benar dengan memberi tanda centang (&#10003;) pada kotak yang tersedia!</p>
    </div>
  `;
  packet.cb.forEach(item => {
    const cbHtml = item.opts.map((opt, idx) => `
      <li class="cb-item">
        <span class="cb-square"></span>
        <span><strong>(${letters[idx]})</strong> ${opt}</span>
      </li>
    `).join('');

    html += `
      <div class="question-card">
        <div class="q-title">
          <span class="q-num">${item.no}</span>
          <div class="q-text">
            <div class="topic-tag">${item.topik}</div>
            <div>${item.q}</div>
          </div>
        </div>
        <ul class="cb-list">${cbHtml}</ul>
      </div>
    `;
  });

  // BAGIAN IV: MENJODOHKAN
  html += `
    <div class="part-banner">
      <h3>BAGIAN IV. MENJODOHKAN (Nomor 38 – 40)</h3>
      <p>Pasangkan setiap premis pada kolom kiri dengan pasangan jawaban yang tepat pada kolom kanan!</p>
    </div>
  `;
  packet.match.forEach(item => {
    const maxRows = Math.max(item.left.length, item.right.length);
    let rowsHtml = '';
    for (let i = 0; i < maxRows; i++) {
      const leftText = item.left[i] ? `<strong>${i + 1}.</strong> ${item.left[i]}` : '';
      const slotText = item.left[i] ? `( ...... )` : '';
      const rightText = item.right[i] ? `<strong>${item.right[i].code}.</strong> ${item.right[i].val}` : '';
      rowsHtml += `
        <tr>
          <td>${leftText}</td>
          <td class="match-ans-slot">${slotText}</td>
          <td>${rightText}</td>
        </tr>
      `;
    }

    html += `
      <div class="question-card">
        <div class="q-title">
          <span class="q-num">${item.no}</span>
          <div class="q-text">
            <div class="topic-tag">${item.topik}</div>
            <div>${item.q}</div>
          </div>
        </div>
        <table class="match-table">
          <thead>
            <tr>
              <th style="width:52%">Premis / Pernyataan</th>
              <th style="width:14%">Pasangan</th>
              <th style="width:34%">Pilihan Jawaban</th>
            </tr>
          </thead>
          <tbody>${rowsHtml}</tbody>
        </table>
      </div>
    `;
  });

  container.innerHTML = html;
}

renderPacket(dataTipeB, 'body-tipeB');
